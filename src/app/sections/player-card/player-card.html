<article class="group relative overflow-hidden rounded-[18px] bg-rp-navy text-white shadow-[0_24px_50px_-24px_rgb(12_1_28/.7)] transition duration-450 ease-sport hover:-translate-y-2 hover:shadow-[0_34px_60px_-24px_rgb(56_0_255/.65)]">
  <div class="player-photo relative aspect-4/5 overflow-hidden bg-rp-abyss">
    <img
      [ngSrc]="player().photo"
      fill
      sizes="(min-width: 1100px) 25vw, (min-width: 640px) 50vw, 100vw"
      [alt]="player().alt"
      [style.object-position]="player().focus"
      class="object-cover grayscale contrast-110 transition duration-800 ease-sport group-hover:scale-106 group-hover:grayscale-20"
    />
    <span class="absolute top-1.5 left-4 z-10 font-display text-[6.5rem] leading-none font-black text-rp-yellow [text-shadow:0_6px_24px_rgb(0_0_0/.5)]" aria-hidden="true">
      {{ player().number }}
    </span>
  </div>
  <div class="relative border-t-4 border-rp-yellow px-5.5 pt-4.5 pb-5.5 after:absolute after:-top-1 after:right-0 after:h-1 after:w-16 after:bg-rp-gold">
    <h3 class="text-[1.75rem] font-black"><span class="sr-only">{{ player().number }} — </span>{{ player().name }}</h3>
    <p class="mt-1.5 text-xs font-bold tracking-[.22em] text-rp-yellow uppercase">{{ player().position }}</p>
  </div>
</article>
